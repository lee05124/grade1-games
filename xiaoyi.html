<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✏️</text></svg>">
<title>小一闖關本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Huninn&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: 作業簿 notebook. Grid-paper ground, each subject is a workbook cover with a white name label; play screens sit on a sheet of paper. Single light look on purpose. */
:root{
  --paper:#F4F7FB; --grid:#DFE7F1; --sheet:#FFFFFF; --ink:#1F2A44; --ink-2:#56627C; --line:#C9D4E3;
  --math:#D9472F; --chin:#2C7A57; --nat:#E09A00; --eng:#3563C9;
  --ok:#2E9E5B; --ok-bg:#E3F5EA; --bad:#C8402F; --bad-bg:#FBE6E2;
  --star:#F2B705;
  --f-ui:"Huninn","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  --f-kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體","Kaiti TC",serif;
  --f-abc:"Andika","Comic Sans MS","Arial Rounded MT Bold",sans-serif;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.55;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--eng);outline-offset:3px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:clamp(28px,6vw,40px);letter-spacing:.04em}
.brand .home{color:var(--ink-2);font-size:15px;text-decoration:none;border-bottom:1.5px dashed var(--line)}
.starbox{display:flex;align-items:center;gap:6px;background:var(--sheet);border:2px solid var(--ink);border-radius:999px;padding:4px 14px 4px 8px;font-variant-numeric:tabular-nums;font-size:18px;white-space:nowrap}
.star{width:22px;height:22px;flex:none}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;border-radius:999px;background:var(--sheet);border:2px solid var(--ink);font-size:16px}

/* workbook covers */
.covers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:560px){.covers{grid-template-columns:1fr}}
.cover{position:relative;text-align:left;background:var(--c);color:#fff;border-radius:6px 16px 16px 6px;padding:20px 20px 18px 34px;min-height:200px;display:flex;flex-direction:column;gap:14px;box-shadow:0 3px 0 rgba(31,42,68,.25);transition:transform .15s}
.cover::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:6px;background:rgba(0,0,0,.16);border-radius:3px}
.cover:hover{transform:translateY(-3px) rotate(-.4deg)}
.cover .big{font-size:34px;letter-spacing:.08em;line-height:1.2}
.cover .what{font-size:15px;opacity:.92}
.label{margin-top:auto;background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:15px}
.label dt{color:var(--ink-2)}
.label dd{margin:0;border-bottom:1.5px dashed var(--line);font-variant-numeric:tabular-nums}
.math{--c:var(--math)}.chin{--c:var(--chin)}.nat{--c:var(--nat)}.eng{--c:var(--eng)}
.nat .cover,.cover.nat{color:#2B1D00}

.note{margin-top:28px;background:var(--sheet);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 18px;font-size:14.5px;color:var(--ink-2);max-width:70ch}
.note b{color:var(--ink);font-weight:400}
.note a{color:var(--eng)}

/* subject menu */
.sheet{background:var(--sheet);border:2px solid var(--ink);border-radius:18px;padding:22px clamp(16px,4vw,32px);box-shadow:0 4px 0 rgba(31,42,68,.18)}
.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.chip{display:inline-block;background:var(--c);color:#fff;border-radius:6px;padding:2px 10px;font-size:14px}
.nat .chip{color:#2B1D00}
.sheet h2{font-size:28px}
.sub{color:var(--ink-2);margin:0 0 18px}
.modes{display:grid;gap:12px}
.mode{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:14px;text-align:left;padding:14px 16px;border:2px solid var(--line);border-radius:var(--r);background:var(--sheet);transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--c);transform:translateX(3px)}
.mode .ico{width:56px;height:56px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:28px;font-family:var(--f-kai)}
.nat .mode .ico{color:#2B1D00}
.mode h3{font-size:20px}
.mode p{margin:0;color:var(--ink-2);font-size:14.5px}
.mode .got{display:flex;gap:2px}
.mode .got .star{width:20px;height:20px}

/* question */
.qbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prog{flex:1;height:12px;border-radius:99px;background:var(--grid);overflow:hidden;border:1.5px solid var(--line)}
.prog i{display:block;height:100%;background:var(--c);transition:width .3s}
.qnum{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:15px;white-space:nowrap}
.prompt{display:flex;align-items:flex-start;gap:10px;font-size:clamp(20px,4.6vw,26px);line-height:1.4;margin-bottom:12px}
.prompt .t{flex:1;min-width:0}
.say{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--sheet);display:grid;place-items:center}
.say svg{width:22px;height:22px}
.visual{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;margin:6px 0 16px;min-height:40px}
.bigchar{font-family:var(--f-kai);font-size:clamp(88px,22vw,128px);line-height:1;width:1.4em;height:1.4em;display:grid;place-items:center;position:relative}
.tian{position:relative;background:#fff;border:2.5px solid var(--bad)}
.tian::before,.tian::after{content:"";position:absolute;inset:0;pointer-events:none}
.tian::before{background:linear-gradient(var(--bad),var(--bad)) center/100% 1.5px no-repeat,linear-gradient(var(--bad),var(--bad)) center/1.5px 100% no-repeat;opacity:.35}
.emoji{font-size:clamp(72px,18vw,104px);line-height:1}
.eq{font-size:clamp(40px,10vw,64px);font-variant-numeric:tabular-nums;letter-spacing:.04em;display:flex;align-items:center;gap:.25em;flex-wrap:wrap;justify-content:center}
.eq .slot{min-width:1.6em;text-align:center;border-bottom:4px solid var(--ink);color:var(--c)}
.abc{font-family:var(--f-abc);font-size:clamp(84px,22vw,120px);line-height:1}
.word{font-family:var(--f-abc);font-size:clamp(36px,9vw,52px);letter-spacing:.06em}
.word u{text-decoration:none;display:inline-block;min-width:.8em;border-bottom:4px solid var(--c);color:var(--c)}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:440px){.opts.three{grid-template-columns:1fr}}
.opt{min-height:68px;border:2.5px solid var(--line);border-radius:var(--r);background:var(--sheet);font-size:22px;padding:10px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:border-color .12s,background .12s,transform .12s}
.opt:hover:not(:disabled){border-color:var(--ink);transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt .kai{font-family:var(--f-kai);font-size:44px;line-height:1}
.opt .rad{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.opt .rad small{font-size:15px;color:var(--ink-2)}
.opt .abc{font-size:52px}
.opt svg.st{width:min(110px,100%);height:auto;aspect-ratio:1;max-width:100%}

.keypad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;max-width:520px;margin:0 auto}
@media (max-width:440px){.keypad{grid-template-columns:repeat(4,minmax(0,1fr))}}
.key{min-height:60px;border-radius:12px;border:2.5px solid var(--line);background:var(--sheet);font-size:26px;font-variant-numeric:tabular-nums}
.key:active{transform:scale(.96)}
.key.go{background:var(--c);border-color:var(--c);color:#fff;grid-column:span 2;font-size:20px}
.key.del{font-size:17px}

.feedback{min-height:30px;margin-top:14px;font-size:19px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.feedback .m{min-width:0;flex:1}
.feedback .yes{color:var(--ok)}
.feedback .no{color:var(--bad)}
.next{background:var(--ink);color:#fff;border-radius:999px;padding:10px 22px;font-size:18px}
.hintbtn{border:2px dashed var(--line);border-radius:999px;padding:6px 14px;font-size:15px;color:var(--ink-2)}
.blocks{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:4px 0 10px}
.bset{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;color:var(--ink-2)}
.bgrp{display:flex;align-items:flex-end;gap:4px;flex-wrap:wrap;max-width:260px;justify-content:center}
.ten{width:10px;height:70px;background:repeating-linear-gradient(var(--c) 0 6px,#fff 6px 7px);border:1.5px solid var(--c);border-radius:2px}
.ones{display:grid;grid-template-columns:repeat(5,10px);gap:2px}
.one{width:10px;height:10px;background:var(--c);border-radius:2px;opacity:.75}

/* writing */
.charrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.cchip{font-family:var(--f-kai);font-size:26px;width:46px;height:46px;border-radius:10px;border:2px solid var(--line);background:var(--sheet);position:relative}
.cchip.on{border-color:var(--c);background:var(--c);color:#fff}
.cchip.done::after{content:"";position:absolute;right:-5px;top:-5px;width:16px;height:16px;border-radius:50%;background:var(--ok);border:2px solid #fff}
.writegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:640px){.writegrid{grid-template-columns:1fr}}
.board{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto;background:#fff;border:3px solid var(--bad);touch-action:none}
.board svg.bg{position:absolute;inset:0;width:100%;height:100%}
.board .hw{position:absolute;inset:0}
.wbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.wbtn{border:2.5px solid var(--ink);border-radius:999px;padding:9px 18px;font-size:17px;background:var(--sheet)}
.wbtn.pri{background:var(--c);border-color:var(--c);color:#fff}
.side h3{font-size:22px;margin-bottom:4px}
.side .count{color:var(--ink-2);margin:0 0 10px}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.steps figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.steps svg{width:100%;max-width:72px;aspect-ratio:1;background:#fff;border:1.5px solid var(--line);border-radius:6px}
.wmsg{min-height:28px;margin-top:12px;text-align:center;font-size:18px}

/* result */
.result{text-align:center;padding:10px 0}
.result .stars{display:flex;justify-content:center;gap:10px;margin:14px 0}
.result .stars .star{width:64px;height:64px}
.result .stars .star.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.result .stars .star:nth-child(2){animation-delay:.15s}.result .stars .star:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(.2) rotate(-30deg)}to{transform:none}}
.result .score{font-size:22px;font-variant-numeric:tabular-nums}
.result .btns{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}
.review{text-align:left;margin:18px auto 0;max-width:520px;font-size:15.5px;color:var(--ink-2)}
.review li{margin:4px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* speech */
function speak(text, lang='zh-TW'){
  try{
    if(!('speechSynthesis' in window)) return false;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=lang==='zh-TW'?0.9:0.8;
    const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-')===lang)||speechSynthesis.getVoices().find(v=>v.lang.startsWith(lang.slice(0,2)));
    if(v) u.voice=v;
    speechSynthesis.speak(u); return true;
  }catch(e){return false;}
}

/* sound */
let ac=null;
function beep(good){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const notes = good?[660,880]:[300,220];
    notes.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,ac.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.18,ac.currentTime+i*.12+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+i*.12+.2);o.connect(g).connect(ac.destination);o.start(ac.currentTime+i*.12);o.stop(ac.currentTime+i*.12+.22);});
  }catch(e){}
}

/* stroke svg (data: Make Me a Hanzi via hanzi-writer-data) */
function strokeSVG(ch, {upto=null, mark=null, cls='st'}={}){
  const d=STROKES[ch]; if(!d) return '';
  const paths=d.strokes.map((p,i)=>{
    let fill='#E3E8F0';
    if(upto!==null){ fill = i<upto ? (i===upto-1?'var(--bad)':'var(--ink)') : '#E9EDF3'; }
    if(mark!==null){ fill = i===mark ? 'var(--bad)' : '#CBD3DF'; }
    return `<path d="${p}" fill="${fill}"/>`;
  }).join('');
  return `<svg class="${cls}" viewBox="0 0 1024 1024" aria-hidden="true">
    <rect x="8" y="8" width="1008" height="1008" fill="#fff" stroke="none"/>
    <path d="M512 0V1024M0 512H1024" stroke="#F0C6BF" stroke-width="6" stroke-dasharray="24 18"/>
    <g transform="translate(0,900) scale(1,-1)">${paths}</g></svg>`;
}

/* ---------- question builders ---------- */
function mathQ(kind){
  const op = kind==='mix' ? pick(['add','sub']) : kind;
  let a,b,ans;
  if(op==='add'){ a=1+rnd(48); b=1+rnd(50-a); ans=a+b; }
  else { a=2+rnd(49); b=1+rnd(a-1); ans=a-b; }
  const sym = op==='add'?'+':'−';
  const carry = op==='add' ? (a%10)+(b%10)>=10 : (a%10)<(b%10);
  return {type:'input', answer:ans, a, b, op,
    prompt: op==='add'?'算算看，答案是多少？':'算算看，還剩多少？',
    say:`${a} ${op==='add'?'加':'減'} ${b} 等於多少？`,
    visual:`<div class="eq"><span>${a}</span><span>${sym}</span><span>${b}</span><span>=</span><span class="slot" id="slot">&nbsp;</span></div>`,
    explain:`${a} ${sym} ${b} = ${ans}${carry?(op==='add'?'（個位滿 10，要進位）':'（個位不夠減，要向十位借 1）'):''}`};
}
function strokeQ(){
  const multi=STROKE_CHARS.filter(c=>STROKES[c].strokes.length>=3);
  if(Math.random()<.4){
    const c=pick(STROKE_CHARS), n=STROKES[c].strokes.length;
    const opts=shuffle([n, ...shuffle([n-1,n+1,n+2].filter(x=>x>0)).slice(0,2)]);
    return {type:'choice', prompt:`「${c}」一共有幾畫？`, say:`${c}，一共有幾畫？`,
      visual:`<div class="bigchar tian">${c}</div>`,
      options:opts.map(x=>({html:`${x} 畫`, ok:x===n})), explain:`「${c}」一共 ${n} 畫。`};
  }
  const c=pick(multi), n=STROKES[c].strokes.length;
  const t=rnd(n);
  const others=shuffle([...Array(n).keys()].filter(i=>i!==t)).slice(0,Math.min(3,n-1));
  const idx=shuffle([t,...others]);
  return {type:'choice', grid:idx.length===3?'three':'', prompt:`「${c}」的第 ${t+1} 筆是哪一筆？`, say:`${c}，的第${t+1}筆，是哪一筆？紅色的那一筆。`,
    visual:`<div class="bigchar tian">${c}</div>`,

    explain:`紅色是第 ${t+1} 筆。`, after:`<div class="steps" style="margin-top:12px">${[...Array(n).keys()].map(i=>`<figure>${strokeSVG(c,{upto:i+1})}<figcaption>第${i+1}筆</figcaption></figure>`).join('')}</div>`};
}

  const opts=shuffle([g,...shuffle(RADICALS.filter(x=>x!==g)).slice(0,3)]);
  return {type:'choice', prompt:`「${c}」的部首是哪一個？`, say:`${c}，的部首是哪一個？`,
    visual:`<div class="bigchar tian">${c}</div>`,
    options:opts.map(x=>({html:`<span class="rad"><span class="kai">${x.form}</span><small>${x.r}部</small></span>`, ok:x===g})),
    explain:`「${c}」是${g.r}部${g.form!==g.r?`，在字裡寫成「${g.form}」`:''}。同一部的字還有：${g.chars.split('').filter(x=>x!==c).join('、')}。`};
}
function natureQs(kind){
  return shuffle(NATURE[kind]).map(([q,em,opts,ex])=>({type:'choice', grid:'three', prompt:q, say:q,
    visual:`<div class="emoji" aria-hidden="true">${em}</div>`,
    options:shuffle(opts.map((o,i)=>({html:esc(o), ok:i===0, say:o}))), explain:ex}));
}
function lowerOpts(L){
  const l=L.toLowerCase(); const pool=(CONFUSE[l]||'').split('').filter(Boolean);
  const rest=shuffle('abcdefghijklmnopqrstuvwxyz'.split('').filter(x=>x!==l&&!pool.includes(x)));
  return shuffle([l,...shuffle(pool).slice(0,2),...rest].slice(0,4));
}
function engQs(kind,n){
  if(kind==='case') return shuffle(LETTERS).slice(0,n).map(L=>({type:'choice', prompt:`大寫 ${L} 的小寫是哪一個？`, say:null, sayEn:L,
    visual:`<div class="abc">${L}</div>`, options:lowerOpts(L).map(x=>({html:`<span class="abc">${x}</span>`, ok:x===L.toLowerCase()})), explain:`${L} 的小寫是 ${L.toLowerCase()}。`}));
  if(kind==='listen') return shuffle(LETTERS).slice(0,n).map(L=>{
    const opts=shuffle([L,...shuffle(LETTERS.filter(x=>x!==L)).slice(0,3)]);
    return {type:'choice', prompt:'按喇叭聽聽看，是哪個字母？', say:null, sayEn:L, autoSay:true,
      visual:`<button class="say" style="width:96px;height:96px" data-en="${L}" aria-label="再聽一次">${SPK}</button>`,
      options:opts.map(x=>({html:`<span class="abc">${x}</span>`, ok:x===L})), explain:`聽到的是 ${L}。`};});
  return shuffle(WORDS).slice(0,n).map(([w,em])=>{
    const L=w[0].toUpperCase();
    const opts=shuffle([L,...shuffle(LETTERS.filter(x=>x!==L)).slice(0,3)]);
    return {type:'choice', prompt:'這個英文單字是哪個字母開頭？', say:null, sayEn:w,
      visual:`<div class="emoji" aria-hidden="true">${em}</div><div class="word"><u>&nbsp;</u>${esc(w.slice(1))}</div>`,
      options:opts.map(x=>({html:`<span class="abc">${x}</span>`, ok:x===L})), explain:`${w} 是 ${L} 開頭。`};});
}
function buildRound(subj,mode){
  const n=10;
  if(subj==='math') return Array.from({length:n},()=>mathQ(mode));
  if(subj==='chin') return Array.from({length:n},()=>mode==='stroke'?strokeQ():radicalQ());
  if(subj==='nat') return natureQs(mode).slice(0,n);
  return engQs(mode,n);
}

/* ---------- screens ---------- */
let cleanup=null;
function go(fn){ if(cleanup){cleanup();cleanup=null;} try{speechSynthesis.cancel();}catch(e){} fn(); window.scrollTo({top:0}); }

function topbar(backTo){
  return `<div class="top">${backTo?`<button class="back" id="backBtn">${BACK}返回</button>`:`<div class="brand"><h1>小一闖關本</h1><a class="home" href="index.html">← 回橡果森林</a></div>`}
    <div class="starbox" aria-label="星星總數">${STAR()}<span>${totalStars()}</span></div></div>`;
}

function home(){
  const cards=Object.entries(SUBJECTS).map(([k,s])=>{
    const max=s.modes.filter(m=>m.n).length*3;
    const got=s.modes.reduce((a,m)=>a+(save.best[k+'-'+m.id]||0),0);
    const extra = k==='chin' ? `<dt>描寫</dt><dd>${Object.keys(save.written).length} / ${STROKE_CHARS.length} 字</dd>` : '';
    return `<button class="cover ${s.cls}" data-s="${k}">
      <div class="big">${s.name}</div><div class="what">${s.what}</div>
      <dl class="label"><dt>科目</dt><dd>${s.name}</dd><dt>星星</dt><dd>${got} / ${max}</dd>${extra}</dl></button>`;
  }).join('');
  app.innerHTML = topbar() + `<div class="covers">${cards}</div>
    <div class="note"><b>給家長：</b>每一關 10 題，答對 9 題以上得 3 顆星。題目可以按喇叭朗讀（要看裝置有沒有中文語音）。星星只存在這台裝置的瀏覽器。
    筆順資料來自開源的 Make Me a Hanzi，只收台灣與大陸筆順一致的基本字；若要對照標準，請看
    <a href="https://stroke-order.learningweb.moe.edu.tw/" target="_blank" rel="noopener">教育部筆順學習網</a>。</div>`;
  app.querySelectorAll('.cover').forEach(b=>b.onclick=()=>go(()=>menu(b.dataset.s)));
}

function menu(k){
  const s=SUBJECTS[k];
  app.innerHTML = topbar(true) + `<div class="sheet ${s.cls}">
    <div class="sheet-head"><span class="chip">${s.name}</span></div>
    <h2>選一個關卡</h2><p class="sub">${s.what}</p>
    <div class="modes">${s.modes.map(m=>{
      const best=save.best[k+'-'+m.id]||0;
      const got = m.n ? `<span class="got" aria-label="最佳 ${best} 顆星">${STAR(best>0)}${STAR(best>1)}${STAR(best>2)}</span>`
                      : `<span class="qnum">${Object.keys(save.written).length}/${STROKE_CHARS.length}</span>`;
      return `<button class="mode" data-m="${m.id}"><span class="ico">${m.ico}</span><span><h3>${m.name}</h3><p>${m.desc}</p></span>${got}</button>`;}).join('')}
    </div></div>`;
  $('#backBtn').onclick=()=>go(home);
  app.querySelectorAll('.mode').forEach(b=>b.onclick=()=>go(()=> b.dataset.m==='write' ? writeScreen(k) : play(k,b.dataset.m)));
}

function play(k,mode){
  const s=SUBJECTS[k], qs=buildRound(k,mode);
  let i=0, right=0, wrongs=[], locked=false, timer=null;
  const onKey=e=>{
    if(!app.querySelector('.keypad')) return;
    if(/^[0-9]$/.test(e.key)) app.querySelector(`.key[data-k="${e.key}"]`)?.click();
    else if(e.key==='Backspace') app.querySelector('.key.del')?.click();
    else if(e.key==='Enter'){ e.preventDefault(); (app.querySelector('.next')||app.querySelector('.key.go'))?.click(); }
  };
  document.addEventListener('keydown',onKey);
  cleanup=()=>{clearTimeout(timer); document.removeEventListener('keydown',onKey);};

  function render(){
    const q=qs[i]; locked=false;
    const speakBtn = (q.say||q.sayEn) && !q.autoSay ? `<button class="say" id="sayBtn" aria-label="唸出來">${SPK}</button>` : '';
    app.innerHTML = topbar(true) + `<div class="sheet ${s.cls}">
      <div class="qbar"><div class="prog"><i style="width:${i/qs.length*100}%"></i></div><span class="qnum">${i+1} / ${qs.length}</span></div>
      <div class="prompt"><span class="t">${esc(q.prompt)}</span>${speakBtn}</div>
      <div class="visual">${q.visual}</div>
      ${q.type==='input'?inputUI(q):choiceUI(q)}
      <div class="feedback" id="fb"><span class="m" id="fbm"></span></div>
      <div id="after"></div></div>`;
    $('#backBtn').onclick=()=>go(()=>menu(k));
    const sb=$('#sayBtn'); if(sb) sb.onclick=()=>q.sayEn?speak(q.sayEn,'en-US'):speak(q.say);
    app.querySelectorAll('[data-en]').forEach(b=>b.onclick=()=>speak(b.dataset.en,'en-US'));
    if(q.autoSay) setTimeout(()=>speak(q.sayEn,'en-US'),250);
    if(q.type==='input') bindInput(q); else bindChoice(q);
  }
  function choiceUI(q){
    return `<div class="opts ${q.grid||''}">${q.options.map((o,j)=>`<button class="opt" data-j="${j}"${o.aria?` aria-label="選項 ${j+1}"`:''}>${o.html}</button>`).join('')}</div>`;
  }
  function bindChoice(q){
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(locked) return; locked=true;
      const o=q.options[+b.dataset.j];
      app.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(q.options[+x.dataset.j].ok) x.classList.add('right');});
      if(!o.ok) b.classList.add('wrong');
      done(o.ok,q);
    });
  }
  function inputUI(q){
    const keys=[1,2,3,4,5,6,7,8,9,0];
    return `<div style="text-align:center;margin:-4px 0 12px"><button class="hintbtn" id="hint">看積木提示</button></div><div id="blocks"></div>
      <div class="keypad">${keys.map(n=>`<button class="key" data-k="${n}">${n}</button>`).join('')}
      <button class="key del" data-k="del">擦掉</button><button class="key go" data-k="ok">確定</button></div>`;
  }
  function blockHTML(n,label){
    const t=Math.floor(n/10), o=n%10;
    return `<div class="bset"><div class="bgrp">${'<span class="ten"></span>'.repeat(t)}<span class="ones">${'<span class="one"></span>'.repeat(o)}</span></div><span>${label} ${n}：${t} 個十、${o} 個一</span></div>`;
  }
  function bindInput(q){
    let val='';
    const slot=$('#slot');
    const show=()=>{slot.textContent=val||' ';};
    $('#hint').onclick=()=>{$('#blocks').innerHTML=`<div class="blocks">${blockHTML(q.a,'')}${blockHTML(q.b,q.op==='add'?'加':'減')}</div>`;};
    app.querySelectorAll('.key').forEach(b=>b.onclick=()=>{
      if(locked) return;
      const k2=b.dataset.k;
      if(k2==='del') val=val.slice(0,-1);
      else if(k2==='ok'){ if(val==='') return; locked=true; const ok=+val===q.answer; slot.style.color=ok?'var(--ok)':'var(--bad)'; done(ok,q); return; }
      else if(val.length<2) val=(val==='0'?'':val)+k2;
      show();
    });
  }
  function done(ok,q){
    beep(ok);
    if(ok) right++; else wrongs.push(q.explain);
    const m=$('#fbm');
    m.innerHTML = ok ? `<span class="yes">答對了！</span> ${esc(q.explain)}` : `<span class="no">再想想。</span>正確答案：${esc(q.explain)}`;
    if(q.after && !ok) $('#after').innerHTML=q.after;
    const nb=document.createElement('button'); nb.className='next'; nb.textContent = i===qs.length-1?'看結果':'下一題';
    nb.onclick=()=>{clearTimeout(timer); next();};
    $('#fb').appendChild(nb);
    if(ok) timer=setTimeout(next,1600);
    nb.focus({preventScroll:true});
  }
  function next(){
    if(!document.body.contains($('#fb'))) return;
    i++; if(i<qs.length) render(); else result();
  }
  function result(){
    const stars = right>=9?3:right>=7?2:right>=5?1:0;
    const key=k+'-'+mode; const prev=save.best[key]||0;
    if(stars>prev){save.best[key]=stars; persist();}
    const msg = stars===3?'太厲害了！':stars===2?'很棒，再一次就三顆星！':stars===1?'有進步，再練一次！':'沒關係，再試一次會更好。';
    app.innerHTML = topbar(true) + `<div class="sheet ${s.cls}"><div class="result">
      <h2>${msg}</h2>
      <div class="stars">${[0,1,2].map(j=>STAR(j<stars).replace('class="star"',`class="star${j<stars?' pop':''}"`)).join('')}</div>
      <p class="score">答對 ${right} / ${qs.length} 題</p>
      ${wrongs.length?`<ol class="review">${wrongs.map(w=>`<li>${esc(w)}</li>`).join('')}</ol>`:''}
      <div class="btns"><button class="wbtn pri" id="again">再玩一次</button><button class="wbtn" id="tomenu">換一關</button></div></div></div>`;
    $('#backBtn').onclick=()=>go(()=>menu(k));
    $('#again').onclick=()=>go(()=>play(k,mode));
    $('#tomenu').onclick=()=>go(()=>menu(k));
    if(stars) beep(true);
  }
  render();
}

function writeScreen(k){
  const s=SUBJECTS[k];
  let cur = STROKE_CHARS.find(c=>!save.written[c]) || STROKE_CHARS[0];
  let writer=null;
  const hasLib = typeof HanziWriter!=='undefined';

  function render(){
    const n=STROKES[cur].strokes.length;
    app.innerHTML = topbar(true) + `<div class="sheet ${s.cls}">
      <div class="sheet-head"><span class="chip">筆順描寫</span></div>
      <p class="sub">選一個字。先按「看示範」，再按「開始寫」，照順序一筆一筆寫。寫錯兩次會出現提示。</p>
      <div class="charrow">${STROKE_CHARS.map(c=>`<button class="cchip${c===cur?' on':''}${save.written[c]?' done':''}" data-c="${c}" aria-label="${c}${save.written[c]?'，寫過了':''}">${c}</button>`).join('')}</div>
      <div class="writegrid">
        <div>
          <div class="board" id="board"><svg class="bg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M50 0V100M0 50H100" stroke="#E7A79B" stroke-width=".6" stroke-dasharray="3 2.4"/></svg><div class="hw" id="hw"></div></div>
          <div class="wbtns"><button class="wbtn" id="demo">看示範</button><button class="wbtn pri" id="quiz">開始寫</button><button class="wbtn" id="sayc" aria-label="唸出這個字">${SPK.replace('<svg','<svg width="20" height="20" style="vertical-align:-4px"')}</button></div>
          <div class="wmsg" id="wmsg"></div>
        </div>
        <div class="side"><h3>「${cur}」的筆順</h3><p class="count">一共 ${n} 畫</p>
          <div class="steps">${[...Array(n).keys()].map(i=>`<figure>${strokeSVG(cur,{upto:i+1})}<figcaption>第${i+1}筆</figcaption></figure>`).join('')}</div></div>
      </div></div>`;
    $('#backBtn').onclick=()=>go(()=>menu(k));
    app.querySelectorAll('.cchip').forEach(b=>b.onclick=()=>{cur=b.dataset.c; render();});
    $('#sayc').onclick=()=>speak(cur);
    const msg=$('#wmsg');
    if(!hasLib){ msg.textContent='描寫功能載入失敗（可能沒有網路），右邊的筆順分解圖還是可以看。'; $('#demo').disabled=$('#quiz').disabled=true; return; }
    const size=$('#board').clientWidth;
    writer=HanziWriter.create('hw',cur,{width:size,height:size,padding:size*.06,
      charDataLoader:(c,onLoad)=>onLoad(STROKES[c]),
      showOutline:true, strokeColor:'#1F2A44', outlineColor:'#E3E8F0', highlightColor:'#2E9E5B',
      drawingColor:'#3563C9', drawingWidth:Math.max(14,size/16), strokeAnimationSpeed:1, delayBetweenStrokes:350});
    $('#demo').onclick=()=>{ msg.textContent='看清楚順序喔。'; writer.cancelQuiz?.(); writer.showCharacter(); writer.animateCharacter({onComplete:()=>{msg.textContent='換你寫寫看！';}}); };
    $('#quiz').onclick=()=>{
      msg.textContent='從第 1 筆開始寫。'; writer.hideCharacter();
      writer.quiz({showHintAfterMisses:2, leniency:1.1,
        onCorrectStroke:d=>{ msg.textContent = d.strokesRemaining? `第 ${d.strokeNum+1} 筆對了！` : ''; },
        onMistake:d=>{ msg.textContent = `第 ${d.strokeNum+1} 筆不太對，再試一次。`; },
        onComplete:sum=>{
          const good=sum.totalMistakes<=2;
          beep(good);
          if(good && !save.written[cur]){ save.written[cur]=true; persist(); }
          msg.innerHTML = good ? `<span style="color:var(--ok)">寫完了！得到一顆星。</span>` : `寫完了，錯了 ${sum.totalMistakes} 次。再寫一次會更好！`;
          const ch=app.querySelector(`.cchip[data-c="${cur}"]`); if(good&&ch) ch.classList.add('done');
          const sb=app.querySelector('.starbox span'); if(sb) sb.textContent=totalStars();
        }});
    };
  }
  render();
}

home();
</script>
